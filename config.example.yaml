# =====================================================================
# Analysts Trading Bot — SIGNALS ONLY.
# This system never places, routes, or executes any trade, paper or
# live, on any venue. No broker/exchange trading credentials exist.
# =====================================================================

# Market data source
data:
  source: yfinance   # "yfinance" (default, futures) | "synthetic" (offline demo data, clearly labeled) | "binance" (reference only, data-only)

# Instrument display mapping (yfinance symbol -> dashboard/Discord label)
instruments:
  "NQ=F":
    display: "NQ"
    name: "Nasdaq 100 futures"
  "ES=F":
    display: "MES"
    name: "S&P 500 futures (micro tracks ES tick-for-tick; signal on ES = trade on MES)"
  "GC=F":
    display: "GOLD"
    name: "Gold futures"
  "CL=F":
    display: "USOIL"
    name: "WTI crude futures"

# Signal engine cycle
cycle:
  interval_minutes: 15   # analyze all instruments every 15 minutes
  autostart: true        # start the signal loop on boot (no Start button needed)

# Binance API 配置 — NOT REQUIRED. Kept only because data.source=binance
# remains selectable for reference; trading paths are stubbed regardless.
binance:
  api_key: ""
  api_secret: ""
  testnet: true

# DeepSeek API 配置 (向后兼容)
# 注意: api_key 会被 .env 文件中的环境变量自动覆盖
deepseek:
  api_key: "DEEPSEEK_API_KEY"       # 会被环境变量 DEEPSEEK_API_KEY 覆盖
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  temperature: 0.3
  max_tokens: 2000

# LLM 配置 (多提供商支持)
# 支持: openai, deepseek, claude, qwen, gemini, kimi, minimax, glm
llm:
  provider: deepseek              # 当前使用的提供商
  model: deepseek-chat            # 模型名称 (留空则使用提供商默认值)
  temperature: 0.3
  max_tokens: 2000
  timeout: 120
  max_retries: 3

# 交易配置 (signal universe — nothing is ever traded)
trading:
  symbols: ["NQ=F", "ES=F", "GC=F", "CL=F"]
  primary_symbol: "NQ=F"
  timeframes: ["5m", "15m", "1h"]   # 1h=trend, 15m=setup (primary), 5m=trigger (ADVISORY-ONLY: ~15min data delay)
  leverage: 1
  symbol_blacklist: []  # 可选：禁用高风险/低流动性币种
  selector_min_quote_volume: 5000000  # 24h USDT成交额下限
  selector_min_price: 0.05  # 过滤超低价币种
  selector_min_quote_volume_per_usdt: 3000  # 动态成交额下限(每1 USDT权益)
  
# 风控配置
risk:
  max_risk_per_trade_pct: 1.5  # 单笔最大风险
  max_total_position_pct: 33.3  # 最大总仓位
  max_leverage: 5
  max_consecutive_losses: 3
  stop_trading_on_drawdown_pct: 10.0
  max_holding_cycles: 180  # 最大持仓周期硬上限 (≈ 9h if cycle_interval=3m)

# Redis 配置
redis:
  host: "localhost"
  port: 6379
  db: 0
  
# 日志配置
logging:
  level: "INFO"
  file: "logs/trading.log"
  
# 回测配置
backtest:
  start_date: "2024-01-01"
  end_date: "2024-12-01"
  initial_capital: 10000

# Agent 配置 (可选 Agent 开关)
# Core agents (DataSyncAgent, QuantAnalystAgent, RiskAuditAgent) 始终启用
agents:
  # ML/AI 预测层
  predict_agent: true              # ML 概率预测
  ai_prediction_filter_agent: true # AI 否决机制 (依赖 predict_agent)
  
  # 市场分析
  regime_detector_agent: true      # 市场状态检测 (趋势/震荡/高波动)
  position_analyzer_agent: false   # 价格位置分析 (区间位置)
  
  # 触发检测
  trigger_detector_agent: true     # 5m K线模式检测
  
  # LLM 语义分析 (消耗 API 额度，默认关闭)
  trend_agent_llm: false           # 1h 趋势 LLM 分析
  setup_agent_llm: false           # 15m 入场 LLM 分析
  trigger_agent_llm: false         # 5m 触发 LLM 分析
  
  # 本地语义分析 (不调用 LLM)
  trend_agent_local: true          # 1h 趋势规则分析
  setup_agent_local: true          # 15m 入场规则分析
  trigger_agent_local: true        # 5m 触发规则分析
  
  # 交易反思
  reflection_agent_llm: false      # 每 10 笔交易后 LLM 反思
  reflection_agent_local: true     # 本地规则反思
  
  # 选币 (crypto AUTO selection — meaningless for the fixed futures set)
  symbol_selector_agent: false
